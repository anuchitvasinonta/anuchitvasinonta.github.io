lang: th
timezone: Asia/Bangkok

title: Greatnote
tagline: Notes on telecom, IT, and life
description: >-
  Notes on telecom, IT technology, DIY, and everyday life in Thailand.

url: "https://anuchitvasinonta.github.io"
baseurl: ""

github:
  username: anuchitvasinonta

social:
  name: Anuchit Vasinonta
  email: vasinonta@gmail.com
  links:
    - https://github.com/anuchitvasinonta

theme_mode: # [light | dark] — leave blank for auto

avatar: # /assets/uploads/avatar.jpg

toc: true

comments:
  active: # leave blank — no comment system configured

analytics:
  google:
    id: # add GA4 Measurement ID here if desired

paginate: 10

theme: jekyll-theme-chirpy

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives

jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

permalink: /:year/:month/:day/:title/

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json
  - vendor
  - Gemfile.lock
