---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%B %-d, %Y" }}
      </time>
      {% if page.categories and page.categories.size > 0 %}
        &nbsp;·&nbsp;
        {% for cat in page.categories %}
          <span class="post-category">{{ cat }}</span>{% unless forloop.last %}, {% endunless %}
        {% endfor %}
      {% endif %}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <div class="post-nav">
    <a href="{{ '/' | relative_url }}">&larr; Back to all posts</a>
  </div>
</article>

<style>
  .post-title { margin-bottom: 0.2em; }
  .post-meta  { color: #888; font-size: 0.9em; margin-bottom: 1.5em; }
  .post-category { background: #e8e8e8; border-radius: 3px; padding: 1px 6px; font-size: 0.85em; }
  .post-content img { max-width: 100%; height: auto; display: block; margin: 1em auto; }
  .post-nav   { margin-top: 2em; border-top: 1px solid #ddd; padding-top: 1em; }
</style>
